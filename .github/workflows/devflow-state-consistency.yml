name: Devflow State Consistency

on:
  push:
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - ".devflow/**"
      - "docs/process/**"
      - "docs/implementation/**"
      - "scripts/devflow/**"
      - "tests/test_devflow*.py"
      - ".github/actions/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - ".devflow/**"
      - "docs/process/**"
      - "docs/implementation/**"
      - "scripts/devflow/**"
      - "tests/test_devflow*.py"
      - ".github/actions/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Validate canonical tasks
        run: |
          EXTRA=()
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            EXTRA+=(--allow-checkout-branch)
          fi
          python scripts/devflow/validate_state.py --all-active "${EXTRA[@]}"
      - name: Validate framework contracts
        run: python scripts/devflow/run_gate_profile.py devflow-targeted
      - name: Upload bounded diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: state-consistency-${{ github.run_id }}
          path: |
            devflow-state-result.json
            devflow-docs-validation.json
            devflow-workflow-validation.json
            devflow-gate-result.json
          if-no-files-found: warn
          retention-days: 7
