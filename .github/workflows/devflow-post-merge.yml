name: Devflow Post Merge
run-name: Devflow Post Merge · task=${{ github.event.client_payload.task_id || inputs.task_id || format('pr={0}', github.event.pull_request.number) }}

on:
  repository_dispatch:
    types:
      - devflow_post_merge
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
      merge_sha:
        required: true
        type: string
      post_merge_profile:
        required: false
        default: post-merge
        type: string
      notify_completion:
        required: false
        default: true
        type: boolean
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  resolve:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      managed: ${{ steps.request.outputs.managed }}
      task_id: ${{ steps.request.outputs.task_id }}
      merge_sha: ${{ steps.request.outputs.merge_sha }}
      post_merge_profile: ${{ steps.request.outputs.post_merge_profile }}
      notify_completion: ${{ steps.request.outputs.notify_completion }}
    steps:
      - name: Check out canonical default-branch state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve dispatch or merged pull request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_MERGE_SHA: ${{ inputs.merge_sha }}
          INPUT_PROFILE: ${{ inputs.post_merge_profile }}
          INPUT_NOTIFY: ${{ inputs.notify_completion }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          event_name = os.environ['EVENT_NAME']
          payload = json.loads(os.environ['PAYLOAD_JSON'] or '{}')
          index = json.loads(
              Path('control/docs/implementation/ACTIVE_TASKS.yaml').read_text(
                  encoding='utf-8'
              )
          )
          tasks = index.get('tasks', [])
          if not isinstance(tasks, list):
              raise SystemExit('ACTIVE_TASKS.tasks must be an array')

          if event_name == 'pull_request':
              pr_number = int(os.environ['PR_NUMBER'])
              matches = [
                  item
                  for item in tasks
                  if isinstance(item, dict)
                  and item.get('pull_request') == pr_number
              ]
              if not matches:
                  print('managed=false')
                  raise SystemExit(0)
              if len(matches) != 1:
                  raise SystemExit('pull request maps to multiple tasks')
              entry = matches[0]
              task_id = entry.get('task_id', '')
              merge_sha = os.environ['PR_MERGE_SHA']
              profile = entry.get('post_merge_profile', 'post-merge')
              notify = entry.get('notify_completion', True)
          else:
              task_id = payload.get('task_id') or os.environ['INPUT_TASK_ID']
              merge_sha = payload.get('merge_sha') or os.environ['INPUT_MERGE_SHA']
              profile = (
                  payload.get('post_merge_profile')
                  or os.environ['INPUT_PROFILE']
                  or 'post-merge'
              )
              raw_notify = payload.get('notify_completion')
              if raw_notify is None:
                  raw_notify = os.environ['INPUT_NOTIFY'] or 'true'
              notify = (
                  raw_notify
                  if isinstance(raw_notify, bool)
                  else str(raw_notify).lower() == 'true'
              )

          if not isinstance(task_id, str) or not re.fullmatch(
              r'[A-Za-z0-9][A-Za-z0-9._-]{0,99}', task_id
          ):
              raise SystemExit('invalid task_id')
          if not isinstance(merge_sha, str) or not re.fullmatch(
              r'[0-9a-f]{40}', merge_sha
          ):
              raise SystemExit('invalid merge_sha')
          if not isinstance(profile, str) or not profile:
              raise SystemExit('invalid post_merge_profile')
          print('managed=true')
          print(f'task_id={task_id}')
          print(f'merge_sha={merge_sha}')
          print(f'post_merge_profile={profile}')
          print(f'notify_completion={str(bool(notify)).lower()}')
          PY

  verify:
    needs: resolve
    if: needs.resolve.outputs.managed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact merged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.resolve.outputs.merge_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workspace/pyproject.toml

      - name: Install exact-merge development dependencies
        run: python -m pip install -e "workspace[dev]"

      - name: Prove exact merge is contained in default branch
        env:
          MERGE_SHA: ${{ needs.resolve.outputs.merge_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$(git -C workspace rev-parse HEAD)" == "$MERGE_SHA" ]]
          git -C workspace fetch --no-tags origin "$DEFAULT_BRANCH"
          git -C workspace merge-base --is-ancestor \
            "$MERGE_SHA" "origin/${DEFAULT_BRANCH}"

      - name: Run independent exact-merge profile
        run: |
          python workspace/scripts/devflow/run_gate_profile.py \
            "${{ needs.resolve.outputs.post_merge_profile }}" \
            --config-root workspace \
            --workdir workspace \
            --output /tmp/post-merge-gate-result.json

      - name: Record exact-merge pass
        run: |
          echo "EXACT_MERGE_POST_MERGE=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "No model session or paid probe was used." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post-merge-${{ github.run_id }}
          path: /tmp/post-merge-gate-result.json
          if-no-files-found: warn
          retention-days: 7

  finalize:
    needs:
      - resolve
      - verify
    if: needs.resolve.outputs.managed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: devflow-post-merge-finalize-${{ needs.resolve.outputs.task_id }}
      cancel-in-progress: false
    outputs:
      state_commit_sha: ${{ steps.commit.outputs.state_commit_sha }}
    steps:
      - name: Check out current canonical default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          fetch-depth: 0
          persist-credentials: true

      - name: Finalize canonical task state
        env:
          TASK_ID: ${{ needs.resolve.outputs.task_id }}
          MERGE_SHA: ${{ needs.resolve.outputs.merge_sha }}
        run: |
          set -euo pipefail
          python control/scripts/devflow/finalize_task.py \
            --repo-root control \
            --task-id "$TASK_ID" \
            --merge-sha "$MERGE_SHA" \
            --run-id "${GITHUB_RUN_ID}"

      - name: Commit canonical task completion
        id: commit
        working-directory: control
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation
          if git diff --cached --quiet; then
            echo "state_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: finalize task ${{ needs.resolve.outputs.task_id }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "state_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  notify:
    needs:
      - resolve
      - finalize
    if: >-
      needs.resolve.outputs.managed == 'true' &&
      needs.resolve.outputs.notify_completion == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dispatch canonical completion notification
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.resolve.outputs.task_id }}
          MERGE_SHA: ${{ needs.resolve.outputs.merge_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          task_id = os.environ['TASK_ID']
          merge_sha = os.environ['MERGE_SHA']
          payload = {
              'event_type': 'devflow_notify',
              'client_payload': {
                  'task_id': task_id,
                  'action': 'COMPLETED',
                  'notification_type': 'COMPLETED',
                  'reason_code': 'POST_MERGE_PASS',
                  'reason': 'Exact-merge verification and canonical finalization passed.',
                  'minimum_action': 'No action is required.',
                  'fingerprint': f'post-merge-pass-{task_id}-{merge_sha}',
                  'source_workflow': 'Devflow Post Merge',
                  'source_run_id': int(os.environ['GITHUB_RUN_ID']),
                  'failure_steps': [],
              },
          }
          Path('/tmp/completed.json').write_text(
              json.dumps(payload), encoding='utf-8'
          )
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input /tmp/completed.json
