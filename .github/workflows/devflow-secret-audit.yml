name: Devflow Secret Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit tracked files without private runtime secrets
        run: python scripts/devflow/secret_audit.py

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-audit-${{ github.run_id }}
          path: secret-audit.json
          if-no-files-found: error
          retention-days: 7
