name: Codex Candidate Review
run-name: Codex Candidate Review · task-ref=${{ inputs.task_commit_sha }}

on:
  workflow_dispatch:
    inputs:
      task_branch:
        description: Data-only task branch containing the descriptor
        required: true
        type: string
      task_commit_sha:
        description: Exact reviewed task commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codex-candidate-review-${{ inputs.task_commit_sha }}
  cancel-in-progress: false

jobs:
  review-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Validate actor and immutable task request
        id: request
        env:
          ACTOR: ${{ github.actor }}
          TASK_BRANCH: ${{ inputs.task_branch }}
          TASK_COMMIT_SHA: ${{ inputs.task_commit_sha }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, 'control/scripts/devflow')
          from config import load_project_config

          config = load_project_config(Path('control'))
          branch = os.environ['TASK_BRANCH']
          sha = os.environ['TASK_COMMIT_SHA']
          if os.environ['ACTOR'] not in config.allowed_actors:
              raise SystemExit('actor is not authorized')
          if not branch.startswith(config.task_data_prefix):
              raise SystemExit('task branch uses the wrong prefix')
          if not re.fullmatch(r'[A-Za-z0-9._/-]+', branch):
              raise SystemExit('task branch contains unsafe characters')
          if '..' in branch or '@{' in branch or '//' in branch:
              raise SystemExit('task branch is not a safe Git ref')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('task_commit_sha must be an exact lowercase SHA')
          print(f'task_branch={branch}')
          print(f'task_commit_sha={sha}')
          PY

      - name: Check out immutable data-only task commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.request.outputs.task_commit_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Run zero-model candidate review
        env:
          TASK_BRANCH: ${{ steps.request.outputs.task_branch }}
          EXPECTED_TASK_SHA: ${{ steps.request.outputs.task_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C workspace rev-parse HEAD)" == "$EXPECTED_TASK_SHA" ]]
          [[ "$(git -C control ls-remote --heads origin "refs/heads/${TASK_BRANCH}" | cut -f1)" == "$EXPECTED_TASK_SHA" ]]
          test -f workspace/.agent/current_task.yaml
          cd control
          python scripts/devflow/codex_candidate_review.py \
            --control-root . \
            --workspace-root ../workspace \
            --task-file ../workspace/.agent/current_task.yaml \
            --output /tmp/codex-candidate-review.json

      - name: Record hard-disabled execution boundary
        run: |
          echo "CODEX_MODEL_INVOCATION=DISABLED" >> "$GITHUB_STEP_SUMMARY"
          echo "Task branches are immutable data-only inputs." >> "$GITHUB_STEP_SUMMARY"
          echo "No Environment Secret or model session was started." >> "$GITHUB_STEP_SUMMARY"
