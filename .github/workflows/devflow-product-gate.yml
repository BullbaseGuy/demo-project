name: Devflow Product Gate
run-name: Devflow Product Gate · task=${{ github.event.client_payload.task_id || inputs.task_id || 'unknown' }}

on:
  repository_dispatch:
    types:
      - devflow_product_gate
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
      task_branch:
        required: true
        type: string
      task_commit_sha:
        required: true
        type: string
      publish_branch:
        required: true
        type: string
      publish_commit_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: devflow-product-gate-${{ github.event.client_payload.task_id || inputs.task_id }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      task_id: ${{ steps.task.outputs.task_id }}
      task_branch: ${{ steps.request.outputs.task_branch }}
      task_commit_sha: ${{ steps.request.outputs.task_commit_sha }}
      publish_branch: ${{ steps.task.outputs.publish_branch }}
      publish_commit_sha: ${{ steps.request.outputs.publish_commit_sha }}
      expected_base_sha: ${{ steps.task.outputs.expected_base_sha }}
      post_merge_profile: ${{ steps.task.outputs.post_merge_profile }}
      auto_merge: ${{ steps.task.outputs.auto_merge }}
      notify_completion: ${{ steps.task.outputs.notify_completion }}
      risk_class: ${{ steps.task.outputs.risk_class }}
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control/pyproject.toml

      - name: Install trusted Devflow dependencies
        run: python -m pip install -e "control[dev]"

      - name: Validate request before branch checkout
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TASK_ID: ${{ github.event.client_payload.task_id || inputs.task_id }}
          TASK_BRANCH: ${{ github.event.client_payload.task_branch || inputs.task_branch }}
          TASK_COMMIT_SHA: ${{ github.event.client_payload.task_commit_sha || inputs.task_commit_sha }}
          PUBLISH_BRANCH: ${{ github.event.client_payload.publish_branch || inputs.publish_branch }}
          PUBLISH_COMMIT_SHA: ${{ github.event.client_payload.publish_commit_sha || inputs.publish_commit_sha }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, 'control/scripts/devflow')
          from config import load_project_config

          config = load_project_config(Path('control'))
          task_id = os.environ['TASK_ID']
          task_branch = os.environ['TASK_BRANCH']
          task_sha = os.environ['TASK_COMMIT_SHA']
          publish_branch = os.environ['PUBLISH_BRANCH']
          publish_sha = os.environ['PUBLISH_COMMIT_SHA']
          actor = os.environ['ACTOR']
          event_name = os.environ['EVENT_NAME']

          safe_ref = re.compile(r'^[A-Za-z0-9._/-]+$')
          safe_task = re.compile(r'^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$')
          safe_sha = re.compile(r'^[0-9a-f]{40}$')

          def valid_ref(value: str) -> bool:
              return bool(
                  safe_ref.fullmatch(value)
                  and not value.startswith(('-', '/'))
                  and not value.endswith(('/', '.', '.lock'))
                  and '..' not in value
                  and '@{' not in value
                  and '//' not in value
              )

          if not safe_task.fullmatch(task_id):
              raise SystemExit('invalid task_id')
          if not task_branch.startswith(config.task_data_prefix) or not valid_ref(task_branch):
              raise SystemExit('invalid task branch')
          if not publish_branch.startswith(config.publish_prefix) or not valid_ref(publish_branch):
              raise SystemExit('invalid publish branch')
          if not safe_sha.fullmatch(task_sha) or not safe_sha.fullmatch(publish_sha):
              raise SystemExit('commit inputs must be exact lowercase SHAs')
          allowed = actor in config.allowed_actors
          bot_dispatch = event_name == 'repository_dispatch' and actor == 'github-actions[bot]'
          if not (allowed or bot_dispatch):
              raise SystemExit('actor is not authorized by .devflow/project.json')

          for key, value in {
              'task_id': task_id,
              'task_branch': task_branch,
              'task_commit_sha': task_sha,
              'publish_branch': publish_branch,
              'publish_commit_sha': publish_sha,
          }.items():
              print(f'{key}={value}')
          PY

      - name: Check out immutable task descriptor
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.request.outputs.task_commit_sha }}
          path: task-data
          fetch-depth: 1
          persist-credentials: false

      - name: Check out immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.request.outputs.publish_commit_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact refs and immutable descriptor
        id: task
        env:
          TASK_ID: ${{ steps.request.outputs.task_id }}
          TASK_BRANCH: ${{ steps.request.outputs.task_branch }}
          TASK_COMMIT_SHA: ${{ steps.request.outputs.task_commit_sha }}
          PUBLISH_BRANCH: ${{ steps.request.outputs.publish_branch }}
          PUBLISH_COMMIT_SHA: ${{ steps.request.outputs.publish_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C task-data rev-parse HEAD)" == "$TASK_COMMIT_SHA" ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "$PUBLISH_COMMIT_SHA" ]]
          [[ "$(git -C control ls-remote --heads origin "refs/heads/${TASK_BRANCH}" | cut -f1)" == "$TASK_COMMIT_SHA" ]]
          [[ "$(git -C control ls-remote --heads origin "refs/heads/${PUBLISH_BRANCH}" | cut -f1)" == "$PUBLISH_COMMIT_SHA" ]]
          test -f task-data/.agent/current_task.yaml
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'control/scripts/devflow')
          from config import load_gate_profiles, load_project_config
          from task_descriptor import TaskDescriptor

          control = Path('control')
          raw = json.loads(
              Path('task-data/.agent/current_task.yaml').read_text(encoding='utf-8')
          )
          task = TaskDescriptor.from_mapping(
              raw,
              config=load_project_config(control),
              profiles=load_gate_profiles(control),
          )
          if task.task_id != os.environ['TASK_ID']:
              raise SystemExit('task_id mismatch')
          if task.publish_branch != os.environ['PUBLISH_BRANCH']:
              raise SystemExit('publish_branch mismatch')
          values = {
              'task_id': task.task_id,
              'publish_branch': task.publish_branch,
              'gate_profile': task.gate_profile,
              'full_gate_profile': task.full_gate_profile,
              'post_merge_profile': task.post_merge_profile,
              'expected_base_sha': task.expected_base_sha,
              'risk_class': task.risk_class,
              'auto_merge': str(task.auto_merge).lower(),
              'notify_completion': str(task.notify_completion).lower(),
          }
          for key, value in values.items():
              print(f'{key}={value}')
          PY

      - name: Check candidate scope from merge base
        env:
          EXPECTED_BASE_SHA: ${{ steps.task.outputs.expected_base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git -C candidate fetch --no-tags origin "$DEFAULT_BRANCH"
          git -C candidate merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          MERGE_BASE="$(git -C candidate merge-base "origin/${DEFAULT_BRANCH}" HEAD)"
          python control/scripts/devflow/verify_changed_paths.py \
            --config-root control \
            --repo-root candidate \
            --task-file task-data/.agent/current_task.yaml \
            --base "$MERGE_BASE" \
            --head HEAD \
            --output /tmp/product-scope-result.json

      - name: Run trusted targeted gate
        run: |
          python control/scripts/devflow/run_gate_profile.py \
            "${{ steps.task.outputs.gate_profile }}" \
            --config-root control \
            --workdir candidate \
            --output /tmp/targeted-gate-result.json

      - name: Run trusted full gate
        run: |
          python control/scripts/devflow/run_gate_profile.py \
            "${{ steps.task.outputs.full_gate_profile }}" \
            --config-root control \
            --workdir candidate \
            --output /tmp/product-gate-result.json

      - name: Upload bounded gate diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-gate-${{ github.run_id }}
          path: |
            /tmp/product-scope-result.json
            /tmp/targeted-gate-result.json
            /tmp/product-gate-result.json
          if-no-files-found: warn
          retention-days: 7

  notify-review:
    needs: gate
    if: needs.gate.outputs.auto_merge != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Stop for reviewed human merge
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.gate.outputs.task_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          task_id = os.environ['TASK_ID']
          payload = {
              'event_type': 'devflow_notify',
              'client_payload': {
                  'task_id': task_id,
                  'action': 'HUMAN_REQUIRED',
                  'notification_type': 'HUMAN_REQUIRED',
                  'reason_code': 'AUTO_MERGE_NOT_APPROVED',
                  'reason': (
                      'All deterministic gates passed, but automatic merge '
                      'is not approved.'
                  ),
                  'minimum_action': 'Review and merge the candidate pull request.',
                  'fingerprint': f'auto-merge-not-approved-{task_id}',
                  'source_workflow': 'Devflow Product Gate',
                  'source_run_id': int(os.environ['GITHUB_RUN_ID']),
                  'failure_steps': [],
              },
          }
          Path('/tmp/notify.json').write_text(json.dumps(payload), encoding='utf-8')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input /tmp/notify.json

  merge:
    needs: gate
    if: >-
      needs.gate.outputs.auto_merge == 'true' &&
      needs.gate.outputs.risk_class == 'low'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    steps:
      - name: Check out exact reviewed base with write credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.gate.outputs.expected_base_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Merge exact reviewed candidate without executing it
        id: merge
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_BASE_SHA: ${{ needs.gate.outputs.expected_base_sha }}
          PUBLISH_BRANCH: ${{ needs.gate.outputs.publish_branch }}
          PUBLISH_COMMIT_SHA: ${{ needs.gate.outputs.publish_commit_sha }}
        run: |
          set -euo pipefail
          CURRENT_DEFAULT="$(git ls-remote --heads origin "refs/heads/${DEFAULT_BRANCH}" | cut -f1)"
          if [[ "$CURRENT_DEFAULT" != "$EXPECTED_BASE_SHA" ]]; then
            echo "MERGE_BOUNDARY_BLOCKED=DEFAULT_BRANCH_MOVED"
            exit 1
          fi
          CURRENT_CANDIDATE="$(git ls-remote --heads origin "refs/heads/${PUBLISH_BRANCH}" | cut -f1)"
          if [[ "$CURRENT_CANDIDATE" != "$PUBLISH_COMMIT_SHA" ]]; then
            echo "MERGE_BOUNDARY_BLOCKED=CANDIDATE_MOVED"
            exit 1
          fi
          git fetch --no-tags origin \
            "+refs/heads/${PUBLISH_BRANCH}:refs/remotes/origin/${PUBLISH_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$DEFAULT_BRANCH" "$EXPECTED_BASE_SHA"
          git merge --no-ff --no-edit "$PUBLISH_COMMIT_SHA"
          MERGE_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:${DEFAULT_BRANCH}"
          echo "merge_sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-merge Post-Merge verification
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.gate.outputs.task_id }}
          TASK_BRANCH: ${{ needs.gate.outputs.task_branch }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          POST_MERGE_PROFILE: ${{ needs.gate.outputs.post_merge_profile }}
          NOTIFY_COMPLETION: ${{ needs.gate.outputs.notify_completion }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              'event_type': 'devflow_post_merge',
              'client_payload': {
                  'task_id': os.environ['TASK_ID'],
                  'task_branch': os.environ['TASK_BRANCH'],
                  'merge_sha': os.environ['MERGE_SHA'],
                  'post_merge_profile': os.environ['POST_MERGE_PROFILE'],
                  'notify_completion': os.environ['NOTIFY_COMPLETION'],
              },
          }
          Path('/tmp/post-merge.json').write_text(
              json.dumps(payload), encoding='utf-8'
          )
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input /tmp/post-merge.json
