name: Devflow Product Gate

on:
  repository_dispatch:
    types:
      - devflow_product_gate
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
      task_branch:
        required: true
        type: string
      publish_branch:
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: devflow-product-gate-${{ github.event.client_payload.task_id || inputs.task_id }}
  cancel-in-progress: false

jobs:
  gate-and-continue:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[dev]"

      - name: Load immutable descriptor
        id: task
        env:
          TASK_ID: ${{ github.event.client_payload.task_id || inputs.task_id }}
          TASK_BRANCH: ${{ github.event.client_payload.task_branch || inputs.task_branch }}
          PUBLISH_BRANCH: ${{ github.event.client_payload.publish_branch || inputs.publish_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${TASK_BRANCH}:refs/remotes/origin/${TASK_BRANCH}" \
            "+refs/heads/${PUBLISH_BRANCH}:refs/remotes/origin/${PUBLISH_BRANCH}"
          git show "refs/remotes/origin/${TASK_BRANCH}:.agent/current_task.yaml" \
            > /tmp/task.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts/devflow')
          from task_descriptor import TaskDescriptor

          task = TaskDescriptor.from_mapping(
              json.loads(Path('/tmp/task.json').read_text())
          )
          if task.task_id != os.environ['TASK_ID']:
              raise SystemExit('task_id mismatch')
          if task.publish_branch != os.environ['PUBLISH_BRANCH']:
              raise SystemExit('publish_branch mismatch')
          for key in (
              'task_id',
              'publish_branch',
              'full_gate_profile',
              'post_merge_profile',
              'expected_base_sha',
              'risk_class',
              'auto_merge',
              'notify_completion',
          ):
              value = getattr(task, key)
              if isinstance(value, bool):
                  value = str(value).lower()
              print(f'{key}={value}')
          PY

      - name: Check candidate scope from merge base
        env:
          PUBLISH_BRANCH: ${{ steps.task.outputs.publish_branch }}
          EXPECTED_BASE_SHA: ${{ steps.task.outputs.expected_base_sha }}
        run: |
          set -euo pipefail
          git switch -C candidate "refs/remotes/origin/${PUBLISH_BRANCH}"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          MERGE_BASE="$(git merge-base origin/${{ github.event.repository.default_branch }} HEAD)"
          python scripts/devflow/verify_changed_paths.py \
            --task-file /tmp/task.json \
            --base "$MERGE_BASE" \
            --head HEAD

      - name: Run full gate
        run: |
          python scripts/devflow/run_gate_profile.py \
            "${{ steps.task.outputs.full_gate_profile }}"

      - name: Stop for review when automatic merge is disabled
        if: steps.task.outputs.auto_merge != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = {
              'event_type': 'devflow_notify',
              'client_payload': {
                  'task_id': '${{ steps.task.outputs.task_id }}',
                  'action': 'HUMAN_REQUIRED',
                  'notification_type': 'HUMAN_REQUIRED',
                  'reason_code': 'AUTO_MERGE_NOT_APPROVED',
                  'reason': (
                      'All deterministic gates passed, but automatic merge '
                      'is not approved.'
                  ),
                  'minimum_action': 'Review and merge the candidate pull request.',
                  'fingerprint': (
                      'auto-merge-not-approved-'
                      '${{ steps.task.outputs.task_id }}'
                  ),
                  'source_workflow': 'Devflow Product Gate',
                  'source_run_id': int('${{ github.run_id }}'),
                  'failure_steps': [],
              },
          }
          Path('/tmp/notify.json').write_text(json.dumps(payload))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input /tmp/notify.json

      - name: Merge reviewed low-risk candidate
        id: merge
        if: >-
          steps.task.outputs.auto_merge == 'true' &&
          steps.task.outputs.risk_class == 'low'
        env:
          PUBLISH_BRANCH: ${{ steps.task.outputs.publish_branch }}
          EXPECTED_BASE_SHA: ${{ steps.task.outputs.expected_base_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git switch -C candidate "refs/remotes/origin/${PUBLISH_BRANCH}"
          CURRENT_DEFAULT="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          if [[ "$CURRENT_DEFAULT" != "$EXPECTED_BASE_SHA" ]]; then
            git rebase "origin/${DEFAULT_BRANCH}"
            python scripts/devflow/verify_changed_paths.py \
              --task-file /tmp/task.json \
              --base "origin/${DEFAULT_BRANCH}" \
              --head HEAD
            python scripts/devflow/run_gate_profile.py \
              "${{ steps.task.outputs.full_gate_profile }}"
          fi
          git switch -C "$DEFAULT_BRANCH" "origin/${DEFAULT_BRANCH}"
          git merge --no-ff --no-edit candidate
          MERGE_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:${DEFAULT_BRANCH}"
          echo "merge_sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-merge Post-Merge verification
        if: steps.merge.outputs.merge_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = {
              'event_type': 'devflow_post_merge',
              'client_payload': {
                  'task_id': '${{ steps.task.outputs.task_id }}',
                  'task_branch': (
                      '${{ github.event.client_payload.task_branch || inputs.task_branch }}'
                  ),
                  'merge_sha': '${{ steps.merge.outputs.merge_sha }}',
                  'post_merge_profile': '${{ steps.task.outputs.post_merge_profile }}',
                  'notify_completion': '${{ steps.task.outputs.notify_completion }}',
              },
          }
          Path('/tmp/post-merge.json').write_text(json.dumps(payload))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input /tmp/post-merge.json
