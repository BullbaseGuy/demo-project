name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: Run complete repository regression regardless of changed paths
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed-path impact
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          FORCE_FULL: ${{ inputs.force_full }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FORCE_FULL" == "true" ]]; then
            printf '%s\n' 'src/__forced_full_regression__' > /tmp/changed-paths.txt
            python scripts/devflow/change_impact.py \
              --paths-file /tmp/changed-paths.txt \
              --github-output "$GITHUB_OUTPUT"
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              BASE_SHA="$PR_BASE_SHA"
            elif [[ "$REF_NAME" == "$DEFAULT_BRANCH" &&
                    "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ &&
                    "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$PUSH_BEFORE_SHA"
            else
              git fetch --no-tags origin "$DEFAULT_BRANCH"
              BASE_SHA="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD)"
            fi
            python scripts/devflow/change_impact.py \
              --base "$BASE_SHA" \
              --head HEAD \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.impact.outputs.impact != 'docs_only'
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        if: steps.impact.outputs.impact != 'docs_only'
        run: python -m pip install -e ".[dev]"

      - name: Validate documentation
        run: python scripts/devflow/validate_docs.py

      - name: Run framework gate
        if: steps.impact.outputs.impact == 'devflow_only'
        run: python scripts/devflow/run_gate_profile.py devflow-targeted

      - name: Run complete repository gate
        if: steps.impact.outputs.impact == 'product'
        run: python scripts/devflow/run_gate_profile.py repository-full

      - name: Record intentional docs-only pass
        if: steps.impact.outputs.impact == 'docs_only'
        run: |
          echo "TEST_GATE=DOCS_ONLY_PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "No previous test result was reused." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-diagnostics-${{ github.run_id }}
          path: |
            change-impact.json
            devflow-docs-validation.json
            devflow-workflow-validation.json
            devflow-gate-result.json
          if-no-files-found: warn
          retention-days: 7
