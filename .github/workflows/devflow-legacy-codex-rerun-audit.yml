name: Devflow Legacy Codex Rerun Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  create:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Collect managed branch names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '[.[].name]' > /tmp/branches.json

      - name: Prove historical branches remain data-only
        run: |
          python scripts/devflow/legacy_codex_branch_audit.py \
            --branches /tmp/branches.json
          echo "HISTORICAL_MODEL_RERUNS=0" >> "$GITHUB_STEP_SUMMARY"
