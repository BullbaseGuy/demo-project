name: Devflow Legacy Codex Rerun Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  create:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect managed branch names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '[.[].name]' > /tmp/branches.json

      - name: Prove historical task branches remain data-only
        run: |
          set -euo pipefail
          python scripts/devflow/legacy_codex_branch_audit.py \
            --branches /tmp/branches.json
          echo "HISTORICAL_MODEL_RERUNS=0" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded audit result on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-task-branch-audit-${{ github.run_id }}
          path: legacy-codex-branch-audit.json
          if-no-files-found: error
          retention-days: 7
